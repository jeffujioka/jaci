name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft

  build:
    needs: draft
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            native: true
            zig: false
          - target: x86_64-apple-darwin
            runner: macos-14
            native: false
            zig: false
          # Built against glibc 2.17 with zig, so it runs on old distributions.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            native: true
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.native
        run: cargo test --locked
      - if: '!matrix.zig'
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
      - if: matrix.zig
        run: cargo install --locked cargo-zigbuild
      - if: matrix.zig
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17
      - if: matrix.zig
        name: Check the binary needs no glibc newer than 2.17
        run: |
          versions=$(objdump -T target/${{ matrix.target }}/release/jaci | grep -o 'GLIBC_[0-9.]*' | sort -uV)
          echo "$versions"
          test "$(printf '%s\nGLIBC_2.17\n' "$versions" | sort -V | tail -n 1)" = GLIBC_2.17
      - run: tar -czf jaci-${{ github.ref_name }}-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release jaci
      - run: gh release upload "$GITHUB_REF_NAME" jaci-${{ github.ref_name }}-${{ matrix.target }}.tar.gz --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false
