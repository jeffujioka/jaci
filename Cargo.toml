[package]
name = "jaci"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Encode images into 24-bit colour ANSI art and show them as a shell-startup banner"
repository = "https://github.com/jeffujioka/jaci"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
libc = "0.2.191"
tempfile = "3.27.0"
terminal_size = "0.4.4"
toml = { version = "1.2.3", default-features = false, features = ["std", "parse", "serde", "display"] }
unicode-width = "0.2.3"

[dev-dependencies]
yaml-rust2 = { version = "0.13.2", default-features = false }

# jaci runs at every shell start: a stripped binary is smaller to load.
[profile.release]
strip = true
