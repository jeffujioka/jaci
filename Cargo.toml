[package]
name = "jaci"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Encode images into 24-bit colour ANSI art and show them as a shell-startup banner"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
